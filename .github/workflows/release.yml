name: Release

# Pushing a vX.Y tag builds a universal app and publishes it as a GitHub
# release, which is also where the app's update check looks.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: swift test
      - run: ./build.sh --universal
      - name: Package
        run: ditto -c -k --keepParent build/MusicBar.app MusicBar.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" MusicBar.zip --title "MusicBar ${TAG#v}" --generate-notes
